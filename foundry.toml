[profile.default]
src = "src"
out = "out"
libs = ["lib"]

remappings = [
    '@openzeppelin/=lib/openzeppelin-contracts/', 
    '@ccip/contracts/=lib/chainlink-ccip/chains/evm/contracts/',
    '@chainlink/contracts/src/v0.8/vendor/openzeppelin-solidity/v5.0.2/contracts=lib/openzeppelin-contracts-5.0.2/contracts/',
    '@chainlink/contracts/src/v0.8/vendor/openzeppelin-solidity/v4.8.3/contracts=lib/openzeppelin-contracts-4.8.3/contracts/',
    
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
